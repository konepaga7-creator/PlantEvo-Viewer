<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> PlantEvo Viewer </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <section class="top_page">
        <header class="header">
            <img src="image/logo-plantevo.svg"alt="logo du site">

           
        </header>
         <nav class="nav">
            <ul>
                <div>
                    <li>Acceuil</li>
                    <li>Menu</li>
                    <li>Nos services</li>
                </div>
                <div>
                    <li>A propos</li>
                    <li>Contacts</li>
                    <li>Equipe</li>
                </div>
            </ul>
        </nav>
        <div class="landig-page">
            
        </div>
        
        
    </section>
    <main>
         <section class="bandeau">
            <img src="image/img foret.png" alt="Forêt vue du ciel" class="bandeau-image">
            <p class="bandeau-texte">
                Du monde aquatique à la vie sur terre.
                Ici, nous vous racontons l'histoire de l'évolution du règne végétal.
            </p>
            
        

        </section>
        <section class="plantes" id="menu">
            <a href="algues" class="carte">
                <img src="image/img algue.png" alt="Algues">
                <span>Algues</span>
            </a>
            <a href="mousses" class="carte">
                <img src="image/mousse.png" alt="Mousses">
                <span>Mousses</span>
            </a>
            <a href="fougeres" class="carte">
                <img src="image/img fougeres.png" alt="Fougères">
                <span>Fougères</span>
            </a>
            <a href="coniferes" class="carte">
                <img src="image/img conifere.png" alt="Conifères">
                <span>Conifères</span>
            </a>
            <a href="graminees" class="carte">
                <img src="image/img graminees.png" alt="Graminées">
                <span>Graminées</span>
            </a>
            <a href="dicotyledones" class="carte">
                <img src="image/img dicotyledones.png" alt="Dicotylédones">
                <span>Dicotylédones</span>
            </a>
        </section>
    </main>
    
    
</body>
</html>
